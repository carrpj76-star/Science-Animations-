<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Carr — Science Animations</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#5b6675; --accent:#1f5f8b; --line:#dfe3e8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:860px; margin:0 auto; padding:40px 16px; }
  h1 { margin:0 0 4px; font-size:1.8rem; }
  p.sub { margin:0 0 32px; color:var(--muted); }
  h2 { font-size:1.05rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:1px solid var(--line); padding-bottom:6px; margin:32px 0 12px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  a.item { display:block; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; color:var(--accent); text-decoration:none; font-weight:600; }
  a.item:hover { border-color:var(--accent); }
  .empty { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>Science Animations</h1>
  <p class="sub">Mr. Carr · Room 453</p>

  <h2>Earth &amp; Space Science (Regents)</h2>
  <ul id="es">
    <li><a class="item" href="carbon-cycle/">The Carbon Cycle</a></li>
    <li><a class="item" href="unearthing-mars/">Unearthing Mars: Orbit Lab</a></li>
  </ul>

  <h2>Environmental Science</h2>
  <ul id="env">
    <li><a class="item" href="oil-spill-cleanup/">Oil Spill Clean Up Simulation</a></li>
  </ul>
</main>
</body>
</html>
